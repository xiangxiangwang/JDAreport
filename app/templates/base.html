<!doctype html>
<html lang="{{ language }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ t('title') }}</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"><link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}"></head>
<body><header><a class="brand" href="/">JDA <span>{{ t('brand') }}</span></a><span class="tag">{{ t('readonly') }}</span>{% if session.get('user') %}<div class="account">{{ session.user }}<form action="/logout" method="post"><input type="hidden" name="csrf" value="{{ session.csrf }}"><button class="quiet">{{ t('logout') }}</button></form></div>{% endif %}<nav class="language-bar" aria-label="{{ t('language') }}"><form action="{{ url_for('set_language') }}" method="post"><input type="hidden" name="csrf" value="{{ session.csrf }}"><input type="hidden" name="page" value="{{ 'home' if request.endpoint == 'home' else 'login' }}"><button type="submit" name="language" value="en" lang="en" aria-pressed="{{ 'true' if language == 'en' else 'false' }}" class="{{ 'active' if language == 'en' else '' }}">English</button><button type="submit" name="language" value="zh-CN" lang="zh-CN" aria-pressed="{{ 'true' if language == 'zh-CN' else 'false' }}" class="{{ 'active' if language == 'zh-CN' else '' }}">中文</button></form></nav></header><main>{% block content %}{% endblock %}</main><footer>JDA Report · {{ t('footer') }}</footer></body></html>
